spring.application.name=SecureSearch Cloud
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/securesearch;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=15MB
server.error.include-message=always
